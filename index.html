<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BID // Bureau of Internal Defense</title>

    <style>
        body {
            margin: 0;
            background: #080a0c;
            color: #d9dde0;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 25px 50px;
            border-bottom: 1px solid #252a2e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        .status {
            color: #b91c1c;
            font-size: 12px;
            letter-spacing: 2px;
        }

        main {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            max-width: 1200px;
            margin: auto;
        }

        .classified {
            color: #b91c1c;
            letter-spacing: 4px;
            font-size: 12px;
        }

        h1 {
            font-size: clamp(50px, 9vw, 120px);
            margin: 20px 0;
            letter-spacing: 10px;
        }

        .subtitle {
            max-width: 600px;
            color: #858b90;
            line-height: 1.8;
        }

        .line {
            width: 100px;
            height: 2px;
            background: #b91c1c;
            margin: 30px 0;
        }

        footer {
            padding: 20px 50px;
            border-top: 1px solid #252a2e;
            color: #555b60;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BID</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<main>
    <div class="classified">BUREAU OF INTERNAL DEFENSE</div>

    <h1>WELCOME.</h1>

    <div class="line"></div>

    <p class="subtitle">
        CENTRAL DATABASE // AUTHORIZED PERSONNEL ONLY
        <br><br>
        Access to classified information is monitored and recorded.
    </p>
</main>

<footer>
    BID // INTERNAL DATABASE // SECURITY CLEARANCE REQUIRED
</footer>

</body>
</html>
